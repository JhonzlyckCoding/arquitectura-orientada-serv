<!DOCTYPE html>
<html>
<head>
    <title>Dprisa - Rutas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header style="text-align: center; margin-bottom: 20px;">
    <h1>Rutas</h1>

    <nav style="margin-bottom: 15px;">
        <details>
            <summary><b>Menú</b></summary>
            <div style="margin-top: 10px;">
                <a href="index.html"><button>Inicio</button></a>
                <a href="mapa.html"><button>Mapa</button></a>
                <a href="reportes.html"><button>Reportes</button></a>
                <a href="soporte.html"><button>Soporte</button></a>
                <a href="registroreporte.html"><button>Reportar incidente</button></a>
            </div>
        </details>
    </nav>
</header>

<hr>

<div class="contenedor-rutas-tarjeta">
  <h2>Historial de Rutas</h2>
  <table id="tabla-rutas" class="tabla-rutas-diseno">
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Origen</th>
        <th>Destino</th>
        <th>Distancia</th>
        <th>Duración</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
  async function cargarHistorialRutas() {
    // 1. Obtener el usuario activo
    const usuarioActivo = JSON.parse(localStorage.getItem("usuarioActivo"));
    const tbody = document.querySelector("#tabla-rutas tbody");

    // Si no hay sesión iniciada, mostramos un mensaje en la tabla
    if (!usuarioActivo || !usuarioActivo.id_usuario) {
      tbody.innerHTML = "<tr><td colspan='5'>Debes iniciar sesión para ver tu historial de rutas.</td></tr>";
      return;
    }

    try {
      // 2. Pedir las rutas al backend usando el ID del usuario
      const respuesta = await fetch(`/api/rutas/${usuarioActivo.id_usuario}`);
      const data = await respuesta.json();

      if (data.success && data.rutas.length > 0) {
        tbody.innerHTML = ""; // Limpiar tabla
        
        // 3. Llenar la tabla dinámica
        data.rutas.forEach(ruta => {
          // Limpiar la fecha que viene de PostgreSQL para que no muestre la zona horaria
          const fechaLimpia = ruta.fecha.split('T')[0];

          const fila = document.createElement("tr");
          fila.innerHTML = `
            <td>${fechaLimpia}</td>
            <td>${ruta.origen}</td>
            <td>${ruta.destino}</td>
            <td>${ruta.distancia}</td>
            <td>${ruta.duracion}</td>
          `;
          tbody.appendChild(fila);
        });
      } else {
        tbody.innerHTML = "<tr><td colspan='5'>Aún no has trazado ninguna ruta.</td></tr>";
      }
    } catch (error) {
      console.error("Error al cargar las rutas:", error);
      tbody.innerHTML = "<tr><td colspan='5'>Error de conexión con el servidor.</td></tr>";
    }
  }

  // Ejecutar automáticamente al cargar la página
  document.addEventListener("DOMContentLoaded", cargarHistorialRutas);
</script>
</body>
</html>
