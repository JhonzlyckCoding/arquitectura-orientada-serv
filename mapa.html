<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dprisa - Mapa</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    #map {
      height: 450px;
      width: 600px;
      margin: auto;
      border: 1px solid #ccc;
    }
    header, section {
      text-align: center;
    }
  </style>
  <!-- Carga de la API de Google Maps con tu API KEY -->
  <!-- Carga de la API de Google Maps con tu API KEY y las librerías extra -->
<script async
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA2x2qVRjzwYRROv5aejYcFJQL5jtf3nRM&callback=initMap&loading=async&libraries=places,geometry">
</script>
</head>
<body>

<header>
  <h1>Mapa</h1>
  <nav>
    <details>
      <summary><b>Menú</b></summary>
      <div>
        <a href="index.html"><button>Inicio</button></a>
        <a href="rutas.html"><button>Rutas</button></a>
        <a href="reportes.html"><button>Reportes</button></a>
        <a href="soporte.html"><button>Soporte</button></a>
        <a href="registroreporte.html"><button>Reportar incidente</button></a>
      </div>
    </details>
  </nav>
</header>

<hr>

<section>
  <h2>Google Maps</h2>
  <div id="map"></div>

  <h3>Funciones del mapa</h3>
  <button onclick="mostrarTrafico()">Tráfico</button>

  <h3>Calcular ruta personalizada</h3>
  <label>Origen: <input type="text" id="origen" placeholder="Ej. Pénjamo, Guanajuato"></label><br><br>
  <label>Destino: <input type="text" id="destino" placeholder="Ej. Irapuato, Guanajuato"></label><br><br>
  <button onclick="calcularRuta()">Calcular Ruta</button>
</section>
<script>
  // Variables globales
  let mapaGlobal;
  let capaTrafico;
  let servicioRutas;
  let renderizadorRutas;
  
  // Variables nuevas para las gasolineras
  let servicioLugares;
  let marcadoresGasolineras = [];

  function initMap() {
    // 1. Configuramos el mapa base
    const contenedorMapa = document.getElementById("map");
    const coordenadasIniciales = { lat: 20.4333, lng: -101.7167 }; // Pénjamo

    mapaGlobal = new google.maps.Map(contenedorMapa, {
      center: coordenadasIniciales,
      zoom: 13,
    });

    // 2. Preparamos las herramientas de rutas
    servicioRutas = new google.maps.DirectionsService();
    renderizadorRutas = new google.maps.DirectionsRenderer();
    renderizadorRutas.setMap(mapaGlobal);

    // 3. Inicializamos el buscador de lugares (Places)
    servicioLugares = new google.maps.places.PlacesService(mapaGlobal);
  }

  // --- LÓGICA DEL BOTÓN TRÁFICO ---
  function mostrarTrafico() {
    if (!capaTrafico) {
      capaTrafico = new google.maps.TrafficLayer();
      capaTrafico.setMap(mapaGlobal);
    } else {
      if (capaTrafico.getMap() == null) {
        capaTrafico.setMap(mapaGlobal);
      } else {
        capaTrafico.setMap(null);
      }
    }
  }

  // --- LÓGICA DEL BOTÓN CALCULAR RUTA ---
  function calcularRuta() {
    const origen = document.getElementById("origen").value;
    const destino = document.getElementById("destino").value;

    if (!origen || !destino) {
      alert("Por favor, ingresa tanto el origen como el destino.");
      return;
    }

    const peticionRuta = {
      origin: origen,
      destination: destino,
      travelMode: google.maps.TravelMode.DRIVING 
    };

    servicioRutas.route(peticionRuta, (resultado, estado) => {
      if (estado === google.maps.DirectionsStatus.OK) {
        // Dibujamos la línea azul
        renderizadorRutas.setDirections(resultado);
        
        // ¡NUEVO!: Mandamos a buscar las gasolineras en esta ruta específica
        buscarGasolinerasEnRuta(resultado.routes[0]);

        const datosTramo = resultado.routes[0].legs[0];
        const distanciaTexto = datosTramo.distance.text;
        const duracionTexto = datosTramo.duration.text;

        const fechaActual = new Date().toISOString().split('T')[0]; // YYYY-MM-DD

        let usuarioActivo = JSON.parse(localStorage.getItem("usuarioActivo"));

        if (usuarioActivo && usuarioActivo.id_usuario){
          fetch('/api/rutas',{
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              id_usuario: usuarioActivo.id_usuario,
              fecha: fechaActual,
              origen: origen,
              destino: destino,
              distancia: distanciaTexto,
              duracion: duracionTexto
            })
          })
          .then(res => res.json())
          .then(data => console.log("Estado de guardado:", data.message))
          .catch(err => console.error("Error al guardar la ruta:", err));
        }
      } else {
        alert("No se pudo calcular la ruta. Error: " + estado);
      }
    });
  }

  // --- LÓGICA PARA ENCONTRAR GASOLINERAS ---
  function buscarGasolinerasEnRuta(ruta) {
    // Limpiamos los iconos del mapa anterior
    limpiarMarcadores();

    // Le decimos a Google que busque "gasolineras" dentro del recuadro general de la ruta
    const peticionBusqueda = {
      query: 'gasolinera',
      bounds: ruta.bounds
    };

    servicioLugares.textSearch(peticionBusqueda, (resultados, estado) => {
      if (estado === google.maps.places.PlacesServiceStatus.OK) {
        
        // Creamos una línea imaginaria con la ruta para hacer cálculos matemáticos
        const lineaRuta = new google.maps.Polyline({
          path: ruta.overview_path
        });

        // Revisamos cada gasolinera encontrada
        resultados.forEach(lugar => {
          // Usamos geometría para ver si la gasolinera toca la ruta. 
          // El 0.015 es la tolerancia (aprox 1.5 km de desviación de la avenida principal)
          const estaEnLaRuta = google.maps.geometry.poly.isLocationOnEdge(
            lugar.geometry.location, 
            lineaRuta, 
            0.015 
          );

          // Si sí está sobre la ruta, le ponemos un icono
          if (estaEnLaRuta) {
            crearMarcadorGasolinera(lugar);
          }
        });
      }
    });
  }

  function crearMarcadorGasolinera(lugar) {
    const marcador = new google.maps.Marker({
      map: mapaGlobal,
      position: lugar.geometry.location,
      title: lugar.name,
      // Le ponemos un icono personalizado de gasolinera nativo de Google
      icon: {
        url: "https://maps.gstatic.com/mapfiles/place_api/icons/v1/png_71/gas_station-71.png",
        scaledSize: new google.maps.Size(25, 25) 
      }
    });

    // Guardamos el marcador en el arreglo para poder borrarlo después
    marcadoresGasolineras.push(marcador);
  }

  function limpiarMarcadores() {
    // Borramos del mapa cada icono guardado
    marcadoresGasolineras.forEach(marcador => marcador.setMap(null));
    // Vaciamos la memoria
    marcadoresGasolineras = [];
  }
</script>
</body>
</html>
