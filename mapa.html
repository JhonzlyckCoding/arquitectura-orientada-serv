<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dprisa - Mapa</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    #map {
      height: 450px;
      width: 600px;
      margin: auto;
      border: 1px solid #ccc;
    }
    header, section {
      text-align: center;
    }
  </style>
  <!-- Carga de la API de Google Maps con tu API KEY -->
  <script async
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA2x2qVRjzwYRROv5aejYcFJQL5jtf3nRM&callback=initMap&loading=async">
  </script>
</head>
<body>

<header>
  <h1>Mapa</h1>
  <nav>
    <details>
      <summary><b>Menú</b></summary>
      <div>
        <a href="index.html"><button>Inicio</button></a>
        <a href="rutas.html"><button>Rutas</button></a>
        <a href="reportes.html"><button>Reportes</button></a>
        <a href="soporte.html"><button>Soporte</button></a>
        <a href="registroreporte.html"><button>Reportar incidente</button></a>
      </div>
    </details>
  </nav>
</header>

<hr>

<section>
  <h2>Google Maps</h2>
  <div id="map"></div>

  <h3>Funciones del mapa</h3>
  <button onclick="mostrarTrafico()">Tráfico</button>

  <h3>Calcular ruta personalizada</h3>
  <label>Origen: <input type="text" id="origen" placeholder="Ej. Pénjamo, Guanajuato"></label><br><br>
  <label>Destino: <input type="text" id="destino" placeholder="Ej. Irapuato, Guanajuato"></label><br><br>
  <button onclick="calcularRuta()">Calcular Ruta</button>
</section>
<script>
  // Variables globales para que cualquier botón pueda acceder a ellas
  let mapaGlobal;
  let capaTrafico;
  let servicioRutas;
  let renderizadorRutas;

  function initMap() {
    // 1. Configuramos el mapa base
    const contenedorMapa = document.getElementById("map");
    const coordenadasIniciales = { lat: 20.4333, lng: -101.7167 }; // Coordenadas de Pénjamo

    mapaGlobal = new google.maps.Map(contenedorMapa, {
      center: coordenadasIniciales,
      zoom: 13,
    });

    // 2. Preparamos las herramientas de rutas y las anclamos al mapa
    servicioRutas = new google.maps.DirectionsService();
    renderizadorRutas = new google.maps.DirectionsRenderer();
    renderizadorRutas.setMap(mapaGlobal);
  }

  // --- LÓGICA DEL BOTÓN TRÁFICO ---
  function mostrarTrafico() {
    if (!capaTrafico) {
      // Si la capa no existe, la creamos y la mostramos
      capaTrafico = new google.maps.TrafficLayer();
      capaTrafico.setMap(mapaGlobal);
    } else {
      // Si ya existe, funciona como un interruptor (prender/apagar)
      if (capaTrafico.getMap() == null) {
        capaTrafico.setMap(mapaGlobal);
      } else {
        capaTrafico.setMap(null);
      }
    }
  }

  // --- LÓGICA DEL BOTÓN CALCULAR RUTA ---
  function calcularRuta() {
    // Capturamos lo que el usuario escribió en los cuadros de texto
    const origen = document.getElementById("origen").value;
    const destino = document.getElementById("destino").value;

    // Validación simple
    if (!origen || !destino) {
      alert("Por favor, ingresa tanto el origen como el destino.");
      return;
    }

    // Armamos la petición para los servidores de Google
    const peticionRuta = {
      origin: origen,
      destination: destino,
      travelMode: google.maps.TravelMode.DRIVING // Viaje en auto
    };

    // Solicitamos la ruta
    servicioRutas.route(peticionRuta, (resultado, estado) => {
      if (estado === google.maps.DirectionsStatus.OK) {
        // Si todo salió bien, dibujamos la línea azul
        renderizadorRutas.setDirections(resultado);
      } else {
        // Si hay un error (ej. escribieron una ciudad que no existe)
        alert("No se pudo calcular la ruta. Verifica que los lugares existan. Error: " + estado);
      }
    });
  }
</script>
</body>
</html>
